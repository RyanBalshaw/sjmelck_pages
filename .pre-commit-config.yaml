# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-json
        exclude: layouts/.*\.json$          # Hugo layout JSON is a Go template, not source JSON
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-xml
    -   id: check-yaml
    -   id: trailing-whitespace             #This hook trims all whitespace from the end of each line
        args:   [ '--markdown-linebreak-ext=md' ]
    -   id: end-of-file-fixer               #This hooks ensures that all files end in a newline and only a newline.
    -   id: mixed-line-ending
        args:   [ '--fix=lf' ]
    -   id: pretty-format-json
        args:   [ '--autofix', '--indent=4', '--no-sort-keys' ]
        exclude: (\.ipynb$|layouts/.*\.json$)
    -   id: check-added-large-files         # this hook will prevent  extremely large files from being committed.
        args:   [ '--maxkb=20000' ]

# Ruff replaces black, isort, flake8 (and covers notebooks natively).
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
    -   id: ruff-check
        args: [ --fix ]
    -   id: ruff-format

# Keep the uv lockfile in sync with pyproject.toml.
-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.10
    hooks:
    -   id: uv-lock
