{{ define "main" }}
  <main class="site-main">
    <div class="site-container">
      <header class="listing-header">
        <p class="text-uppercase small fw-semibold text-body-secondary mb-2">Tag</p>
        <h1>Posts tagged “{{ .Title }}”</h1>
        <p class="lead text-body-secondary">{{ len .RegularPages }} {{ if eq (len .RegularPages) 1 }}post{{ else }}posts{{ end }}</p>
      </header>

      <div class="post-grid">
        {{ range where .RegularPages.ByPublishDate.Reverse "Section" "blog" }}
          {{ partial "post-card.html" . }}
        {{ end }}
      </div>
    </div>
  </main>
{{ end }}
