{{ define "main" }}
<main class="site-main">
  <div class="site-container search-page" data-index-url="{{ "index.json" | relURL }}">
    <header class="listing-header">
      <p class="section-kicker">Find an article</p>
      <h1>Search</h1>
      <p class="lead text-body-secondary">Search titles, descriptions, topics, authors, and article text.</p>
    </header>

    <form class="search-page__form" action="{{ "search/" | relURL }}" method="get" role="search">
      <label class="visually-hidden" for="search-query">Search Sjmelck</label>
      <i class="bi bi-search" aria-hidden="true"></i>
      <input id="search-query" name="q" type="search" autocomplete="off" placeholder="Try “Fourier” or “Python”">
    </form>

    <p id="search-status" class="search-status" aria-live="polite">Enter a term to search the blog.</p>
    <div id="search-results" class="post-grid"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script src="{{ "js/search.js" | relURL }}" defer></script>
{{ end }}
