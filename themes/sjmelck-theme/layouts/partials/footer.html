<footer class="site-footer">
  <div class="site-container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
    <span>&copy; {{ now.Format "2006" }} {{ site.Title }}</span>
    <nav aria-label="Footer">
      <a href="https://github.com/RyanBalshaw/sjmelck_pages" rel="noopener noreferrer">GitHub</a>
      <span aria-hidden="true"> · </span>
      <a href="{{ "index.xml" | relURL }}">RSS</a>
      <span aria-hidden="true"> · </span>
      <a href="https://gohugo.io/" rel="noopener noreferrer">Built with Hugo</a>
    </nav>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="{{ "js/colour_mode_toggler.js" | relURL }}"></script>
{{ if and .IsPage (eq .Section "blog") }}
  <script src="{{ "js/scroll_detector.js" | relURL }}"></script>
  {{ if .Params.toc }}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tocbot/4.18.2/tocbot.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        tocbot.init({
          tocSelector: ".js-toc",
          contentSelector: ".js-toc-content",
          headingSelector: "h1, h2, h3",
          ignoreSelector: ".heading-anchor",
          collapseDepth: 6,
          headingsOffset: 90,
          scrollSmoothOffset: -90,
          orderedList: false
        });
      });
    </script>
  {{ end }}
{{ end }}
<script src="{{ "js/link_copy_to_clipboard.js" | relURL }}"></script>
{{ if .Store.Get "hasCode" }}<script src="{{ "js/code_copy.js" | relURL }}"></script>{{ end }}
